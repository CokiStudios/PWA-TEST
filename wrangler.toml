name = "coki-gemini-pwa-suite"
main = "worker.js"
compatibility_date = "2024-11-01"

# Route for your domain in Cloudflare
routes = [
  { pattern = "cokistudios.com/testingproof/pwas/*", zone_name = "cokistudios.com" }
]

# Workers Static Assets (serves HTML, CSS, JS, SVGs with ultra-fast CDN caching)
[assets]
directory = "./"
binding = "ASSETS"
