<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="dailyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090f"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glowDaily" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#dailyBg)" stroke="#ec4899" stroke-width="4" stroke-opacity="0.3"/>
  <!-- Central Sun & Flow -->
  <circle cx="256" cy="220" r="80" fill="url(#sunGrad)" filter="url(#glowDaily)"/>
  <!-- Dynamic Waves / Rays -->
  <path d="M120 360 C 180 300, 332 400, 392 340" fill="none" stroke="url(#sunGrad)" stroke-width="22" stroke-linecap="round" filter="url(#glowDaily)"/>
  <path d="M150 400 C 220 350, 292 430, 362 380" fill="none" stroke="url(#sunGrad)" stroke-width="16" stroke-linecap="round" opacity="0.7"/>
  <!-- Sparkles -->
  <circle cx="140" cy="150" r="12" fill="#f59e0b"/>
  <circle cx="370" cy="130" r="16" fill="#ec4899"/>
  <text x="256" y="460" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="26" font-weight="bold" letter-spacing="4">COKI DAYFLOW</text>
</svg>