<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="4" stroke-opacity="0.4"/>
  <!-- Inner circular glow -->
  <circle cx="256" cy="256" r="160" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <!-- Code Brackets & Sparkle -->
  <path d="M170 170 L90 256 L170 342" fill="none" stroke="url(#gemGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M342 170 L422 256 L342 342" fill="none" stroke="url(#gemGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Center Star/Sparkle -->
  <path d="M256 160 Q256 256 310 256 Q256 256 256 352 Q256 256 202 256 Q256 256 256 160 Z" fill="url(#gemGrad)" filter="url(#glow)"/>
  <!-- Text Label -->
  <text x="256" y="430" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="26" font-weight="bold" letter-spacing="4">COKI CODE &amp; MCP</text>
</svg>